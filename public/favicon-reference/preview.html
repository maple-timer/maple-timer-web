<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MapleN Favicon Reference</title>
    <style>
      body {
        margin: 0;
        background: #f4f2e7;
        color: #241a13;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(760px, calc(100% - 32px));
        margin: 40px auto;
      }

      h1 {
        margin: 0 0 18px;
        font-size: 26px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
      }

      .card {
        padding: 18px;
        border: 1px solid #dfd6c8;
        border-radius: 12px;
        background: #ffffff;
      }

      .sizes {
        display: flex;
        align-items: center;
        gap: 16px;
        min-height: 190px;
      }

      .s180 {
        width: 180px;
        height: 180px;
      }

      .s48 {
        width: 48px;
        height: 48px;
      }

      .s24 {
        width: 24px;
        height: 24px;
      }

      strong,
      code {
        display: block;
      }

      code {
        margin-top: 5px;
        color: #735f50;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MapleN Favicon Reference</h1>
      <section class="grid">
        <article class="card">
          <div class="sizes">
            <img class="s180" src="./maplen-apple-icon.png" alt="MapleN original apple icon" />
            <img class="s48" src="./maplen-favicon.png" alt="" />
            <img class="s24" src="./maplen-favicon.png" alt="" />
          </div>
          <strong>Original MapleN.gg</strong>
          <code>maplen-apple-icon.png / maplen-favicon.png</code>
        </article>
        <article class="card">
          <div class="sizes">
            <img class="s180" src="./maplen-inspired-clock.svg" alt="Clock version" />
            <img class="s48" src="./maplen-inspired-clock.svg" alt="" />
            <img class="s24" src="./maplen-inspired-clock.svg" alt="" />
          </div>
          <strong>Clock Version</strong>
          <code>maplen-inspired-clock.svg</code>
        </article>
      </section>
    </main>
  </body>
</html>
